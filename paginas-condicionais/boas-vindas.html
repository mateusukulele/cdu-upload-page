<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boas-vindas</title>
<script src="/js/iframeResizer.contentWindow.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:transparent;}
.bv{--roxo:#443468;--roxo-fundo:#2D2249;--coral:#E87A85;--coral-texto:#4D1A20;--coral-suave:#FBEAEC;--texto:#1F1A2B;--texto-suave:#5C5A70;--superficie:#ECEAF1;--fundo:#F5F4F7;--verde:#1F8C7A;color:var(--texto);max-width:860px;margin:0 auto;padding:12px;line-height:1.6;}
.bv *{box-sizing:border-box;}
.bv-wrap{display:flex;flex-direction:column;gap:16px;}
.bv-hero{position:relative;background:linear-gradient(135deg,var(--roxo),var(--roxo-fundo))!important;border-radius:18px;padding:20px;color:#fff!important;overflow:hidden;}
.bv-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--roxo),var(--coral));}
.bv-hero .bv-eyebrow{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral)!important;font-weight:700;margin-bottom:6px;}
.bv-hero h1{margin:0;font-size:clamp(19px,4.6vw,28px);font-weight:700;line-height:1.18;color:#fff!important;}
.bv-card{background:#fff;border:1px solid var(--superficie);border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(31,26,43,.06);}
.bv-video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;}
.bv-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.bv-card--venda{background:linear-gradient(180deg,#fff,var(--fundo));}
.bv-h2{font-size:19px;font-weight:700;color:var(--roxo)!important;margin:0 0 12px;line-height:1.3;}
.bv-card--venda p{margin:0 0 12px;font-size:14.5px;color:var(--texto)!important;text-align:justify;}
.bv-card--venda p:last-of-type{margin-bottom:16px;}
.bv-cta{display:flex;align-items:center;justify-content:center;gap:9px;text-align:center;text-decoration:none!important;background:var(--verde)!important;color:#fff!important;padding:16px 22px;border-radius:14px;font-weight:700;font-size:15px;line-height:1.3;word-break:break-word;cursor:pointer;border:0;width:100%;animation:bvpulse 1.9s ease-in-out infinite;transition:filter .15s,transform .12s;}
.bv-cta:hover{filter:brightness(1.05);transform:translateY(-1px);}
@keyframes bvpulse{0%{box-shadow:0 0 0 0 rgba(31,140,122,.45);}70%{box-shadow:0 0 0 16px rgba(31,140,122,0);}100%{box-shadow:0 0 0 0 rgba(31,140,122,0);}}
@media(prefers-reduced-motion:reduce){.bv-cta{animation:none;}}
.bv-center{text-align:center;}
.bv-muted{font-size:13.5px;color:var(--texto-suave);}
.bv-hide{display:none!important;}
.bv-spin{display:inline-block;width:24px;height:24px;border:3px solid var(--superficie);border-top-color:var(--coral);border-radius:50%;animation:bvgira .8s linear infinite;}
@keyframes bvgira{to{transform:rotate(360deg);}}
/* Modal (popup de reserva, quando nao ha dados do aluno) */
.bv-modal{position:fixed;inset:0;background:rgba(45,34,73,.55);display:none;align-items:flex-start;justify-content:center;padding:24px 14px;z-index:100;overflow-y:auto;}
.bv-modal.on{display:flex;}
.bv-modal__card{background:#fff;border-radius:20px;max-width:26rem;width:100%;padding:22px;position:relative;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);}
.bv-modal__x{position:absolute;top:.7rem;right:.7rem;width:2rem;height:2rem;border:0;border-radius:999px;background:var(--fundo);color:var(--texto-suave);font-size:18px;cursor:pointer;}
.bv-modal h3{font-size:1.2rem;color:var(--roxo);text-align:center;margin:0 0 4px;}
.bv-modal .sub{text-align:center;color:var(--texto-suave);font-size:13px;margin:0 0 16px;}
.bv-field{margin-bottom:12px;}
.bv-field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--texto-suave);margin:0 0 5px 3px;}
.bv-field input{width:100%;padding:12px 14px;border:1px solid var(--superficie);border-radius:12px;background:var(--fundo);font:inherit;font-size:15px;color:var(--texto);}
.bv-field input:focus{outline:0;border-color:var(--roxo);background:#fff;}
.bv-phone{display:flex;gap:8px;}
.bv-phone select{flex-shrink:0;max-width:44%;border:1px solid var(--superficie);border-radius:12px;background:var(--fundo);font:inherit;font-size:13px;color:var(--texto);padding:12px 6px;}
.bv-phone input{flex:1;min-width:0;}
.bv-err{color:#D93A3A;font-size:11px;font-weight:600;margin:4px 0 0 3px;display:none;}
.bv-err.on{display:block;}

.cdu-dica-fs{display:none;}
@media (max-width:500px){.cdu-dica-fs{display:block;margin-top:10px;padding:10px 12px;border-radius:9px;background:#FBEAEC;border-left:4px solid #E87A85;color:#4D1A20;font-size:13.5px;line-height:1.5;}}
.cdu-dica-fs b{font-size:17px;line-height:1;vertical-align:-.06em;}
.cdu-dica-fs svg{width:1.15em;height:1.15em;fill:currentColor;vertical-align:-.22em;}
</style>
</head>
<body>

<div class="bv"><main class="bv-wrap">

  <div id="bv-pagante">
    <header class="bv-hero"><span class="bv-eyebrow">Comece por aqui</span><h1>Bem-vindo(a) à Plataforma de aulas do Clube do Ukulele</h1></header>
    <section class="bv-card"><div class="bv-video"><iframe src="https://player.vimeo.com/video/1208129293" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div><p class="cdu-dica-fs">Para assistir em tela cheia, toque no <b>&#8249;</b> na barra do player e depois no <svg viewBox="0 0 24 24" role="img" aria-label="tela cheia"><path d="M2 2 10 2 7.2 4.8 11.4 9 9 11.4 4.8 7.2 2 10ZM22 10 19.2 7.2 15 11.4 12.6 9 16.8 4.8 14 2 22 2ZM2 14 4.8 16.8 9 12.6 11.4 15 7.2 19.2 10 22 2 22ZM22 22 14 22 16.8 19.2 12.6 15 15 12.6 19.2 16.8 22 14Z"/></svg>. A velocidade e a qualidade tamb&eacute;m ficam a&iacute; dentro.</p></section>
  </div>

</main></div>
</body>
</html>
