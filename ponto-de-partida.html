<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --anchor:#443468; --anchor-deep:#2D2249; --coral:#E87A85; --coral-text:#4D1A20;
  --text:#1F1A2B; --text-soft:#55536B; --surface:#ECEAF1; --card:#fff;
  --linha:#E7E3EF; --ok:#1F8C7A;
}
body{font-family:Montserrat,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:transparent;color:var(--text);line-height:1.55}
.atv-wrap{max-width:720px;margin:0 auto;padding:8px 14px 40px}

.atv-hero{position:relative;background:linear-gradient(135deg,var(--anchor),var(--anchor-deep));border-radius:16px;padding:18px 20px;color:#fff;margin-bottom:14px;overflow:hidden}
.atv-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--anchor),var(--coral))}
.atv-hero .eyebrow{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);font-weight:700;margin-bottom:6px}
.atv-hero h2{font-size:clamp(18px,4vw,24px);line-height:1.2;font-weight:700}
.atv-hero p{font-size:14.5px;color:#E4DEF2;margin-top:8px}

.atv-card{background:var(--card);border:1px solid rgba(68,52,104,.12);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(68,52,104,.08)}
.atv-card.pergunta{animation:entra .14s ease-out}
@keyframes entra{from{opacity:.45}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.atv-card.pergunta{animation:none}}
.atv-pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:var(--coral);color:var(--coral-text);margin-bottom:12px}
.contexto{font-size:14px;color:var(--text-soft);background:var(--surface);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.enunciado{font-size:17px;font-weight:600;line-height:1.4;margin-bottom:14px}
.sub{font-size:14px;color:var(--text-soft);margin:-8px 0 14px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--linha);border-radius:12px;padding:13px 14px;cursor:pointer;background:#fff;font-size:14.5px;transition:border-color .12s,background .12s}
.opt:hover{border-color:#C0B4DC;background:#FCFBFE}
.opt[data-sel=true]{border-color:var(--anchor);background:#F4F1FA}
.opt[data-off=true]{cursor:not-allowed;background:#F5F4F8;border-color:#EDEAF3;color:#5F5C76}
.opt[data-off=true] .letra,.opt[data-off=true] .marca{border-color:#DCD7E8;color:#6E6A85}
.opt .letra{flex:0 0 auto;width:24px;height:24px;border:1.5px solid var(--linha);border-radius:6px;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--text-soft);background:#FBFAFE}
.opt[data-sel=true] .letra{border-color:var(--anchor);color:var(--anchor);background:#fff}
@media(max-width:600px){.opt .letra{display:none}.opt{font-size:16px}}
.opt .marca{flex:0 0 auto;width:20px;height:20px;border:2px solid #C0B4DC;border-radius:50%;margin-top:1px;display:grid;place-items:center}
.opt.check .marca{border-radius:6px}
.opt[data-sel=true] .marca{border-color:var(--anchor);background:var(--anchor)}
.opt[data-sel=true] .marca::after{content:'';width:8px;height:8px;background:#fff;border-radius:50%}
.opt.check[data-sel=true] .marca::after{border-radius:2px}
.opt.confirmando{border-color:var(--ok);background:#F3FAF7}
.opt img.desenho{flex:1;min-width:0;max-width:300px;border-radius:8px;background:#fff;border:1px solid var(--linha)}

textarea.livre,input.livre{width:100%;border:1.5px solid var(--linha);border-radius:12px;padding:12px;font:inherit;font-size:16px;resize:vertical;min-height:70px}
textarea.livre:focus,input.livre:focus{outline:0;border-color:var(--anchor)}
input.livre{min-height:0;padding:13px 12px;display:block}
.contador{font-size:13px;color:var(--text-soft);text-align:right;margin-top:4px;display:flex;justify-content:space-between;gap:10px}
.dica-teclado{font-size:12.5px;color:var(--text-soft)}

.treino{margin-bottom:14px;border-radius:14px;overflow:hidden}
.btn-texto{background:none;border:0;color:var(--anchor);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:underline;padding:0}
.dicas{background:var(--surface);border-radius:12px;padding:14px 16px;margin:0 0 16px;font-size:13.5px;color:var(--text-soft)}
.dicas b{display:block;color:var(--anchor);margin-bottom:8px;font-size:13.5px}
.dicas ul{margin:0;padding-left:18px}
.dicas li{margin-bottom:6px}
.prog{height:8px;border-radius:99px;background:var(--surface);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:var(--coral);transition:width .2s}

.progresso{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.barra{flex:1;height:8px;border-radius:99px;background:#DED7EE;overflow:hidden}
.barra i{display:block;height:100%;background:var(--coral);transition:width .25s}
.progresso span{font-size:13px;color:var(--text-soft);white-space:nowrap}

.nav{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;background:var(--coral);color:#fff}
.btn:disabled{background:#C4BFD2;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--anchor);border:1.5px solid var(--linha);flex:0 0 auto;padding:14px 18px}
.dica-auto{flex:1;display:flex;align-items:center;justify-content:center;font-size:13.5px;color:var(--text-soft)}
.abertura{font-size:15px;margin-bottom:12px;line-height:1.6}

.res-hero{background:linear-gradient(135deg,var(--anchor),var(--anchor-deep));border-radius:16px;padding:22px;color:#fff;margin-bottom:14px}
.res-hero .eyebrow{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);font-weight:700;margin-bottom:6px}
.res-hero h2{font-size:clamp(19px,4.4vw,26px);line-height:1.2;margin-bottom:8px}
.res-hero p{font-size:15px;color:#E4DEF2}
.destino{font-size:21px;font-weight:700;color:var(--anchor);margin-bottom:2px}
.destino-sub{font-size:14.5px;color:var(--text-soft);margin-bottom:14px}
.roteiro{margin:0 0 14px 20px;font-size:15px;line-height:1.55}
.roteiro li{margin-bottom:8px}
.apd{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.apd div{background:var(--surface);border-radius:10px;padding:11px 12px}
.apd b{display:block;font-size:14px;color:var(--anchor);margin-bottom:3px}
.apd small{font-size:12.5px;color:var(--text-soft);line-height:1.45}
.upload{border:2px dashed #C0B4DC;background:#FAF9FD;border-radius:14px;padding:18px;text-align:center;font-size:14px;color:var(--text-soft)}

.aviso{background:#FDF4E6;border:1px solid #E3C892;border-radius:12px;padding:12px 14px;font-size:14px;color:#6B4711;margin-bottom:14px}
.carregando{text-align:center;padding:40px 0;color:var(--text-soft);font-size:15px}

/* ===== INICIO CSS ROTINA (o build recorta daqui) ===== */
/* Nomes com prefixo próprio de propósito: a classe `.barra` já existe no template, na
   barra de progresso do questionário, e a regra de lá pintava estes segmentos de coral
   por especificidade. Colisão de nome de classe custou uma publicação. */
.rot-titulo{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--text-soft);margin:20px 0 8px}
.rot-titulo.solto{margin-top:24px}
.semana{margin:0;padding-left:20px;font-size:14.5px}
.semana li{margin-bottom:6px}
.semana li b{color:var(--anchor)}
.semana li i{font-style:normal;color:var(--text-soft);font-size:13.5px}

.painel{border:1px solid var(--linha);border-radius:14px;padding:14px;background:#FCFBFE}
.painel{margin-bottom:12px}
.painel h4{font-size:17px;color:var(--anchor);margin-bottom:6px}
.painel h4 span{display:block;font-size:12.5px;font-weight:400;color:var(--text-soft);margin-top:1px}
.painel .porque{font-size:13.5px;color:var(--text);margin:0 0 14px;padding:10px 12px;background:var(--surface);border-radius:10px}
.painel .quando{font-size:13.5px;color:var(--text-soft);margin:0 0 8px}
.painel .quando b{color:var(--anchor)}
.proporcao{display:flex;height:14px;border-radius:99px;overflow:hidden;margin-bottom:14px;background:var(--surface)}
.proporcao span{display:block;height:100%}
.bl-aq{background:#B9A7E0}.bl-ap{background:#443468}.bl-pr{background:#7E68B5}.bl-dv{background:#E8A0A8}
.blista{list-style:none;margin:0;padding:0}
.blista li{display:flex;gap:11px;align-items:baseline;padding:9px 0;border-top:1px dashed var(--linha)}
.blista li:first-child{border-top:0}
.blista .pt{flex:0 0 11px;height:11px;border-radius:3px;align-self:center}
.blista .min{flex:0 0 58px;font-weight:700;font-size:15px;color:var(--anchor)}
.blista .txt b{display:block;font-size:14.5px}
.blista .txt small{display:block;font-size:12.5px;color:var(--text-soft);margin-top:1px}
.blista .txt em{display:block;font-size:12.5px;color:var(--text-soft);font-style:normal;margin-top:3px}

details.dobra{border:1px solid var(--linha);border-radius:14px;margin-bottom:14px;background:#fff}
details.dobra>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;font-size:15px;color:var(--anchor);
  display:flex;justify-content:space-between;align-items:center;gap:10px}
details.dobra>summary::-webkit-details-marker{display:none}
details.dobra>summary::after{content:'ver';font-size:12.5px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:.06em}
details.dobra[open]>summary::after{content:'fechar'}
details.dobra>summary small{display:block;font-weight:400;font-size:13px;color:var(--text-soft);margin-top:2px}
details.dobra>summary>span{min-width:0}
details.dobra .corpo{padding:0 16px 16px}

@media print{
  .nav,.progresso,.upload,.no-print,.treino,.dica-auto,.dicas{display:none !important}
  body{background:#fff}
  .atv-wrap{max-width:100%;padding:0}
  .atv-card{border:1px solid #C9C2DA;box-shadow:none;padding:12px 14px;margin-bottom:10px;break-inside:avoid}
  .res-hero{background:#fff;color:var(--text);border:2px solid var(--anchor);padding:14px;break-inside:avoid}
  .res-hero h2{color:var(--anchor)}
  .res-hero p,.res-hero .eyebrow{color:var(--text-soft)}
  .atv-pill{background:#fff;color:var(--anchor);border:1px solid var(--anchor);padding:2px 8px}
  /* A tabela é o coração da ficha impressa. `overflow-x:auto` corta o que passa da
     largura no papel, então na impressão ela volta a ser um bloco normal. */
  /* No papel não existe "dia de hoje": vale a comparação. Todos os painéis aparecem e
     todas as dobras abrem, senão a ficha impressa sai pela metade. */
  .proporcao span{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .painel{break-inside:avoid;margin-bottom:10px}
  .painel .porque{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  details.dobra>summary::after{content:'' !important}
  details.dobra .corpo{display:block !important}
  .blocos div{background:#fff;border:1px solid #E7E3EF;break-inside:avoid}
  .roteiro,.semana,.blista{break-inside:avoid}
  .rodape-impresso{display:block !important;margin-top:14px;font-size:10.5px;color:#6E6A85;text-align:center}
  /* Impressão pedida pelo botão: só a rotina e o rodapé. Ctrl+P direto continua
     imprimindo a ficha inteira, para quem quiser. */
  body.so-rotina .atv-wrap>*:not(.rotina-print):not(.rodape-impresso){display:none !important}
  body.so-rotina .rotina-print{border:0;padding:0}
  @page{size:A4;margin:14mm}
}
.rodape-impresso{display:none}
</style>

/* ---------- ESTADO ---------- */
function padrao(){return {resp:{},i:0,abriu:false,finalizado:false,enviado:false,uid:'',
  videoOk:false,videoAdiado:false,editando:false};}
let e=carregar();
function carregar(){
  try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.resp)return Object.assign(padrao(),s);}catch(x){}
  return padrao();
}
function salvar(){try{localStorage.setItem(LS,JSON.stringify(e));}catch(x){}}

/* ---------- PORTÕES ---------- */
function semInstrumento(s){return ['esperando','nao_tem'].includes(s.resp.A1);}
function afinaNao(s){return ['nao_percebe','percebe'].includes(s.resp.N2);}
/* Teto do Mapa, balizado na Etapa 4 do MAPA DO INICIANTE (itens 66 a 73): os quatro
   acordes mágicos no tom de C com a Batida Pop 1, e os mesmos no tom de G (G, Em, C, D)
   com a Pop 1 E a Pop 2. O teto é o tom de G com as duas batidas: é o que fecha o
   Ukulele Fundamental e abre o Iniciante 2. */
function acimaDoMapa(s){return s.resp.NM1==='sai'&&s.resp.NM2==='sai';}
function visiveis(){return Q.filter(q=>!q.se||q.se(e));}

/* ---------- DECISÃO: uma de três saídas ---------- */
/* A régua de baixo é o nome da Etapa 1 do Mapa: DO ZERO À 1ª MÚSICA. Quem ainda não
   tocou uma música inteira não terminou o Iniciante 0, e é isso que a N1 pergunta.
   A régua de cima é a Etapa 4: os quatro acordes mágicos no tom de C com a Pop 1 e,
   em seguida, no tom de G com a Pop 2, os dois a 90 bpm.

   Nenhuma pergunta do MVP levanta flag de vocabulário. As calibrações (nome das cordas,
   ler desenho de batida) saíram: com a decisão D2 elas não moviam a saída, e o vídeo já
   é pedido a todo mundo, então não sobrava trabalho para elas fazerem. */
function decidir(){
  if(semInstrumento(e)) return {saida:'i0',fronteira:false,motivo:'sem instrumento'};
  const decl=e.resp.N1;
  if(!decl) return {saida:null,fronteira:false,motivo:'âncora não respondida'};

  if(decl<=3){
    return {saida:'i0',fronteira:false,
      motivo:'declarou '+decl+', ainda sem música inteira: Iniciante 0'
        +(afinaNao(e)?' | e ainda não percebe desafinação':'')};
  }
  if(afinaNao(e)) return {saida:'i1',fronteira:true,
    motivo:'toca música inteira mas não percebe desafinação: Iniciante 1, com fronteira'};

  const tomC=e.resp.NM1,tomG=e.resp.NM2;
  if(tomC==='sai'&&tomG==='sai') return {saida:'passou',fronteira:false,
    motivo:'os quatro mágicos saem a 90 no tom de C e no de G: passou do Mapa'};
  if(tomC==='sai') return {saida:'i1',fronteira:false,
    motivo:'os quatro saem no tom de C, o de G ainda não: fim do Iniciante 1'};
  return {saida:'i1',fronteira:false,
    motivo:'toca música inteira, mas os quatro mágicos ainda não saem no tom de C: início do Iniciante 1'};
}
function curso(){const sa=decidir().saida;return sa?SAIDA[sa]:null;}
/* O vídeo é sempre pedido. O que muda é o roteiro, e para quem passou do Mapa muda
   também O QUE tocar: é a P1 e a P2 que decidem isso. */
/* Quem está começando do zero não manda vídeo: não tem o que mostrar, e pedir só
   assusta. O pedido começa em quem já passou dessa régua, que é a mesma da N1. */
function pedeVideo(){const p=perfilVideo();return p!==null&&p!=='zero';}
function perfilVideo(){
  const d=decidir(); if(!d.saida) return null;
  if(d.saida==='passou') return 'passou';
  if(semInstrumento(e)||!e.resp.N1||e.resp.N1<=2) return 'zero';
  return 'toca';
}

/* ---------- widget de treino ----------
   Quadro do gerador de batidas (oficina.clubedoukulele.com), que mostra os acordes, o
   desenho da batida e um metrônomo. Ele manda a própria altura por postMessage, e é o
   `ligarTreino()` que escuta. O `preconnect` paga DNS, TCP e TLS antes de o quadro
   precisar, porque esta origem é nova para quem abre a peça.

   `loading="eager"` de propósito: aqui o quadro é o assunto da tela, não algo abaixo da
   dobra. E ele só aparece quando a pergunta aparece. */
const ORIGEM_TREINO='https://oficina.clubedoukulele.com';
try{const l=document.createElement('link');l.rel='preconnect';l.href=ORIGEM_TREINO;document.head.appendChild(l);}catch(x){}
addEventListener('message',ev=>{
  if(ev.origin!==ORIGEM_TREINO) return;
  const d=ev.data; if(!d||d.cdu!=='treino-altura'||!(d.h>0)) return;
  document.querySelectorAll('iframe[data-cdu-treino]').forEach(q=>{
    if(q.contentWindow===ev.source) q.style.height=d.h+'px';
  });
});
function treinoHTML(t){
  return `<div class="treino"><iframe data-cdu-treino src="${ORIGEM_TREINO}/treino?b=${t.b}"
    title="${t.titulo}" loading="eager" scrolling="no" allow="autoplay"
    style="width:100%;height:500px;border:0;display:block;background:transparent"></iframe></div>`;
}

}

const BLOCO={
  aq:{nome:'Aquecimento',oque:'Mecânica pura, sem música: soltar a mão, trocar acorde no vazio.',sinal:'Ninguém reconheceria o que você está tocando.'},
  ap:{nome:'Aprendizado',oque:'O que você ainda não consegue. Devagar, repetido, feio. A aula nova entra aqui.',sinal:'Você erra. Se não está errando, isso não é Aprendizado, é Prática.'},

  dv:{nome:'Diversão',oque:'O que você já sabe, do jeito que quiser. Música velha, cantar junto, tocar para alguém.',sinal:'Você não corrige nada. Se parou para consertar, saiu do bloco.'}
};

/* Todo Dia de Avanço é seguido por um dia de prática forte: aprender e não voltar nisso
   no dia seguinte é jogar o minuto fora. O Dia Livre só entra a partir de quatro dias,
   porque com dois ou três cada sessão é cara demais para uma delas não ter aprendizado. */
const RECEITA={2:['avanco','reforco'],
               3:['avanco','reforco','equilibrado'],
               4:['avanco','reforco','equilibrado','livre'],
               5:['avanco','reforco','equilibrado','avanco','livre']};

/* Bloco de Aprendizado ou Prática acima de 12 minutos vira duas passadas com 1 minuto de
   pausa de verdade no meio, e o minuto sai de dentro do próprio bloco: o dia não cresce.
   Não vale para a Diversão, que não tem esforço a interromper. */
function passadas(n){ if(n<=12) return null; const u=n-1; return [Math.floor(u/2),Math.ceil(u/2)]; }

function monta(min,k){
  const g=GRADE[min][k],aq=AQUECIMENTO[min];
  return {k,nome:DIA[k].nome,sub:DIA[k].sub,quando:DIA[k].quando,
    aq,ap:g.ap,pr:g.pr,dv:g.dv,apPassadas:passadas(g.ap),prPassadas:passadas(g.pr)};
}
function rotina(){
  const min=e.resp.R2,dias=e.resp.R1;
  if(!min||!dias||!GRADE[min]) return null;
  const receita=(RECEITA[dias]||RECEITA[5]).map(k=>monta(min,k));
  /* O Dia Livre só entra na semana a partir de quatro dias, mas ele é mostrado sempre:
     existe o dia em que não bate vontade de estudar, e tocar sem cobrança é melhor que
     não pegar o ukulele. Quando não está na semana, ele aparece como extra, com o
     porquê escrito. */
  return {min,dias,aq:AQUECIMENTO[min],receita,
    leve:monta(min,'leve'),
    livre:monta(min,'livre'),
    livreNaSemana:receita.some(d=>d.k==='livre'),
    seisEmDiante:dias>=5};
}

/* ---------- ROTINA: o que o aluno lê ----------
   Tudo daqui é sugestão, e o texto tem que soar assim. Plano escolhido pelo aluno é
   cumprido; plano mandado é abandonado. */
/* Barra de proporção: mostra o formato do dia antes de qualquer número. */
function barraDia(d){
  const tot=d.aq+d.ap+d.pr+d.dv;
  return `<div class="proporcao" role="presentation">${[['aq',d.aq],['ap',d.ap],['pr',d.pr],['dv',d.dv]]
    .filter(x=>x[1]>0).map(([k,n])=>`<span class="bl-${k}" style="width:${(n/tot*100).toFixed(1)}%"></span>`).join('')}</div>`;
}
function itemBloco(k,n,pass){
  if(!n) return '';
  const b=BLOCO[k];
  return `<li><span class="pt bl-${k}"></span><span class="min">${n} min</span>
    <span class="txt"><b>${b.nome}</b><small>${b.oque}</small>
    ${pass?`<em>Duas passadas: ${pass[0]} min, 1 minuto de pausa de verdade, e mais ${pass[1]} min.</em>`:''}</span></li>`;
}
const NOTA_EXTRA={
  leve:'Chegou o dia e você está acabado? Troca o que estava marcado por este. Isso não é furar o plano. Furar o plano é não pegar o ukulele.',
  livre:'Este não entra na sua semana porque, com poucos dias, cada sessão conta muito. Mas ele existe para quando não bate vontade de estudar, ou quando você só quer tocar por tocar depois de um tempo puxado. Tocar sem cobrança é melhor que não pegar o ukulele.'
};
function painelDia(d,nota){
  return `<div class="painel" data-dia="${d.k}">
    <h4>${d.nome}<span>${d.sub}</span></h4>
    <p class="quando"><b>Quando usar:</b> ${d.quando}</p>
    <p class="porque">${PORQUE[d.k]}</p>
    ${barraDia(d)}
    <ul class="blista">${itemBloco('aq',d.aq,null)}${itemBloco('ap',d.ap,d.apPassadas)}${itemBloco('pr',d.pr,d.prPassadas)}${itemBloco('dv',d.dv,null)}</ul>
    ${nota?`<p class="quando" style="margin:12px 0 0">${nota}</p>`:''}
  </div>`;
}
function rotinaHTML(){

    <p class="rot-titulo">Rotina recomendada</p>
    <p class="sub" style="margin:0 0 12px">Duas coisas valem para todos os dias. O <b>Aquecimento</b> aparece em todos, inclusive nos de pegar leve: mão fria com movimento novo é a causa mais comum de dor. E toda sessão <b>termina em Diversão</b>, porque a memória do estudo é a última coisa que aconteceu, não a média do dia.</p>
    ${usados.map(d=>painelDia(d,'')).join('')}

    <p class="rot-titulo solto">Para os dias de pegar mais leve</p>
    <p class="sub" style="margin:0 0 12px">Estes não entram na sua semana de propósito, e usar um deles não é furar o plano. Ninguém agenda estar cansado nem sem vontade, e é justamente por isso que eles existem: furar o plano é não pegar o ukulele.</p>

    <p class="sub" style="margin:12px 0 0">A aula nova entra no bloco de Aprendizado. Os seus ${r.min} minutos comportam ela, é para isso que esse bloco existe. E se você já tiver assistido antes, no ônibus ou lavando louça, melhor ainda: aí os ${r.min} minutos inteiros ficam com o ukulele na mão.</p>
  </section>`;
}
/* O seletor de dia saiu: agora todos os dias ficam abertos, um abaixo do outro.
   A função continua existindo, vazia, porque o resultado a chama. */
function ligarRotina(){}

function corpoHTML(q){
  const r=e.resp[q.id];
  if(q.tipo==='radio') return `<div class="opts">${q.opcoes.map((o,i)=>
    `<label class="opt" data-sel="${r===o.v}" data-i="${i}"><span class="letra">${LETRAS[i]}</span><span class="marca"></span>${o.img?`<img class="desenho" src="${o.img}" alt="desenho de batida">`:`<span>${o.t}</span>`}</label>`).join('')}</div>`;
  if(q.tipo==='check'){
    const sel=Array.isArray(r)?r:[],cheio=q.limite&&sel.length>=q.limite;
    return `<div class="opts">${q.opcoes.map((o,i)=>{
      const on=sel.includes(o.v),off=!!(cheio&&!on&&!o.exclusiva);
      return `<label class="opt check" data-sel="${on}" data-off="${off}" data-i="${i}"><span class="letra">${LETRAS[i]}</span><span class="marca"></span><span>${o.t}</span></label>`;}).join('')}</div>
      ${q.limite?`<p class="contador">${sel.length} de ${q.limite}</p>`:''}`;
  }
  if(q.tipo==='texto') return `<textarea class="livre" id="livre" maxlength="${q.max}"></textarea><div class="contador"><span class="dica-teclado">Enter para seguir, Shift e Enter para pular linha</span> <span id="cont">0</span>/${q.max}</div>`;
  if(q.tipo==='linha') return `<input class="livre" id="livre" maxlength="${q.max}"><div class="contador"><span class="dica-teclado">Enter para seguir</span> <span id="cont">0</span>/${q.max}</div>`;
  return '';
}

function ligarCorpo(q){
  if(q.tipo==='radio'||q.tipo==='check'){
    palco.querySelectorAll('.opt').forEach(el=>{
      if(el.dataset.off==='true')return;
      el.onclick=()=>{
        const o=q.opcoes[+el.dataset.i];
        if(q.tipo==='radio'){
          e.resp[q.id]=o.v;
          render();
          const alvo=palco.querySelector('.opt[data-sel=true]');
          if(alvo) alvo.classList.add('confirmando');
          clearTimeout(avancoTimer);
          /* Corrigindo uma resposta, o avanço automático não segue para a próxima
             pergunta: ele devolve a pessoa para o resultado, que é de onde ela veio. */
          avancoTimer=setTimeout(()=>{
            if(e.editando){terminarEdicao();return;}
            if(e.i<visiveis().length){e.i++;render();}
          },260);
          return;
        }
        else{
          let sel=Array.isArray(e.resp[q.id])?e.resp[q.id].slice():[];
          if(o.exclusiva) sel=sel.includes(o.v)?[]:[o.v];
          else{
            sel=sel.filter(v=>!(q.opcoes.find(x=>x.v===v)||{}).exclusiva);
            sel.includes(o.v)?sel.splice(sel.indexOf(o.v),1):sel.push(o.v);
            if(q.limite&&sel.length>q.limite) sel=sel.slice(-q.limite);
          }
          e.resp[q.id]=sel;
          const fechou = (o.exclusiva && sel.includes(o.v)) || (q.limite && sel.length===q.limite);
          if(fechou){
            render();
            const alvo=palco.querySelector(`.opt[data-i="${el.dataset.i}"]`);
            if(alvo) alvo.classList.add('confirmando');
            clearTimeout(avancoTimer);
            avancoTimer=setTimeout(()=>{ if(e.i<visiveis().length){e.i++;render();} },320);
            return;
          }
        }
        render();
      };
    });
  }
  if(q.tipo==='texto'||q.tipo==='linha'){
    const ta=document.getElementById('livre');ta.value=e.resp[q.id]||'';
    document.getElementById('cont').textContent=ta.value.length;
    ta.oninput=()=>{e.resp[q.id]=ta.value;document.getElementById('cont').textContent=ta.value.length;salvar();
      const av=document.getElementById('avancar'); if(av) av.disabled=!podeAvancar(q);};
    ta.onkeydown=ev=>{ if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault(); if(podeAvancar(q)){e.i++;render();}} };
  }
}
function podeAvancar(q){
  if(q.opcional)return true;
  if(q.tipo==='linha') return !!(e.resp[q.id]||'').trim();
  const r=e.resp[q.id];
  if(q.tipo==='check')return Array.isArray(r)&&r.length>0;
  return r!==undefined&&r!=='';
}

/* ---------- RENDER ---------- */
let palco=document.getElementById('palco');
const HERO={A:'Primeiro, um pouco da sua história',N:'O ukulele nas suas mãos',X:'Você passou do Mapa do Iniciante',R:'Seu tempo, do jeito que ele é',O:'Onde você quer chegar'};
const NOMEB={A:'Chegada',N:'Onde você está',X:'Acima do Mapa',R:'Rotina',O:'Objetivo e você'};
let avancoTimer=null, vis=[];

function render(){
  /* O `remote.js` troca o body inteiro no ready do jQuery, e a referência guardada lá em
     cima vira um nó solto: o innerHTML ia para um elemento fora do documento e a página
     ficava em branco, com `getElementById` devolvendo null logo em seguida. Pegar o palco
     de novo a cada render é o que segura isso. */
  palco=document.getElementById('palco')||palco;
  salvar();
  vis=visiveis();
  if(e.finalizado){renderResultado();return;}
  if(e.i>=vis.length){
    /* Quem passou da régua do zero só vê o resultado depois de mandar o vídeo. Quem
       está no zero não tem o que gravar, e vai direto. */
    /* Um vídeo por nivelamento. Depois de enviado, a tela de envio não volta mais: o
       aluno vê a ficha dele e acompanha a análise em Minhas Análises. */
    if(pedeVideo()&&!e.videoOk&&!e.videoAdiado){renderVideo();return;}
    finalizar();return;
  }
  if(!e.abriu){renderAbertura();return;}
  renderPergunta();
}

function renderAbertura(){
  palco.innerHTML=`
    <div class="atv-hero">
      <span class="eyebrow">Ponto de Partida</span>
      <h2>${PRIMEIRO?PRIMEIRO+', vamos achar o seu ponto de partida':'Vamos achar o seu ponto de partida'}</h2>
    </div>
    <section class="atv-card">
      <p class="abertura">São poucas perguntas, menos de cinco minutos. No fim você recebe um plano curto e com o seu nome, dizendo por qual curso começar e como encaixar o estudo na semana que você tem de verdade. Não existe resposta errada e nada aqui vale nota.</p>
      <p class="abertura">Deixa o ukulele por perto, se ele já estiver com você. E se ainda não chegou, fica tranquilo: tem um caminho mais curto esperando, e o seu plano sai do mesmo jeito.</p>
      <button class="btn" id="comecar">Começar</button>
      <p class="dica-teclado" style="margin-top:12px;text-align:center">Dá para responder tudo pelo teclado: as letras escolhem e Enter segue.</p>
    </section>`;
  const b=document.getElementById('comecar');
  b.onclick=()=>{e.abriu=true;if(!e.uid&&crypto.randomUUID)e.uid=crypto.randomUUID();render();};
  b.focus();

function renderPergunta(){
  const q=vis[e.i],pct=Math.round((e.i/vis.length)*100);
  palco.innerHTML=`
    <div class="progresso"><div class="barra"><i style="width:${pct}%"></i></div><span>${e.i+1} de ${vis.length}</span></div>
    <div class="atv-hero"><span class="eyebrow">${NOMEB[q.bloco]}</span><h2>${HERO[q.bloco]}</h2></div>
    <section class="atv-card pergunta">
      ${q.treino?treinoHTML(q.treino):''}
      ${q.contexto?`<p class="contexto">${q.contexto}</p>`:''}
      <p class="enunciado">${q.enunciado}</p>
      ${q.sub?`<p class="sub">${q.sub}</p>`:''}
      ${corpoHTML(q)}
    </section>
    <div class="nav">
      <button class="btn ghost" id="voltar" ${e.i===0?'disabled':''}>Voltar</button>
      ${(q.tipo==='radio'&&e.i<vis.length-1&&!e.editando)?'<span class="dica-auto">Escolha uma opção para seguir</span>':
        `<button class="btn" id="avancar" ${podeAvancar(q)?'':'disabled'}>${e.editando?'Salvar e voltar':(e.i===vis.length-1?(pedeVideo()?'Ir para o vídeo':'Ver meu resultado'):'Continuar')}</button>`}
    </div>
    ${e.editando?'':'<p style="text-align:center;margin-top:12px"><button class="btn-texto" id="recomecar">Recomeçar do zero</button></p>'}`;
  ligarCorpo(q);
  const sair=()=>{ if(e.editando){e.editando=false;e.finalizado=true;render();reenviar();} else {e.i=vis.length;render();} };
  document.getElementById('voltar').onclick=()=>{clearTimeout(avancoTimer);
    if(e.editando){e.editando=false;e.finalizado=true;render();reenviar();} else {e.i--;render();} };
  const av=document.getElementById('avancar');
  if(av) av.onclick=()=>{ if(e.editando||e.i>=vis.length-1) sair(); else {e.i++;render();} };
  const rec=document.getElementById('recomecar');
  if(rec) rec.onclick=()=>{
    if(!confirm('Isso apaga as suas respostas e começa de novo, do zero. Quer mesmo recomeçar?')) return;
    const uid=e.uid; e=padrao(); e.abriu=true; e.uid=uid; salvar(); render();
  };
}



function finalizar(){
  e.finalizado=true;
  render();
  enviar();
}
/* Corrigir uma resposta depois de finalizar muda a decisão, então a linha tem que ser
   reenviada. O `tentativa_uid` continua o mesmo: para o Worker é a mesma tentativa. */
function reenviar(){ e.enviado=false; enviar(); }
/* Fecha a correção de uma resposta: volta para o resultado e reenvia a linha, porque a
   decisão pode ter mudado com a troca. */
function terminarEdicao(){ e.editando=false; e.finalizado=true; render(); reenviar(); }

/* ---------- VÍDEO ----------
   O vídeo é parte de terminar, não um extra depois do resultado: o aluno chega aqui,
   grava, manda, e só então vê o Ponto de Partida dele. O envio é o mesmo componente tus
   das atividades, com o mesmo endpoint e os mesmos metadados, para o vídeo cair na
   esteira que já existe.

   A saída de emergência é de propósito: uma conexão ruim não pode custar o questionário
   inteiro. Quem sai por ela fica com `video_pendente` na planilha. */
function renderVideo(){
  if(e.videoOk){ finalizar(); return; }   /* um vídeo só, e ele já veio */

  const roteiro=ROTEIRO;

  palco.innerHTML=`
    <div class="atv-hero"><span class="eyebrow">Falta uma coisa</span>
      <h2>${PRIMEIRO?PRIMEIRO+', agora eu quero te conhecer':'Agora eu quero te conhecer'}</h2>

      </div>

        <div class="sub" style="margin:0"><span id="pct">0</span>% enviado</div>
        <div class="prog"><i id="barra"></i></div>
      </div>
      <p id="erroEnvio" class="sub" style="display:none;color:#B83A2E;margin:12px 0 0">A sua conexão pode ter oscilado. Tenta mandar de novo.</p>
    </section>
    <div class="nav"><button class="btn ghost" id="voltar">Voltar</button></div>
    <p style="text-align:center;margin-top:12px"><button class="btn-texto" id="adiar">Não consigo gravar agora, quero ver o meu resultado</button></p>`;

  document.getElementById('voltar').onclick=()=>{e.i=visiveis().length-1;render();};
  document.getElementById('adiar').onclick=()=>{e.videoAdiado=true;finalizar();};
  const arq=document.getElementById('arq'),esc=document.getElementById('escolher');
  esc.onclick=()=>arq.click();
  arq.onchange=ev=>{ const f=ev.target.files[0]; if(f) enviaVideo(f); };

function enviaVideo(f){
  const esc=document.getElementById('escolher'),area=document.getElementById('progarea'),
        erro=document.getElementById('erroEnvio');
  esc.style.display='none'; area.style.display='block'; erro.style.display='none';
  const up=new tus.Upload(f,{
    endpoint:TUS, chunkSize:10485760,
    metadata:{filename:f.name,filetype:f.type,
      student_name:ALUNO.nome,student_email:ALUNO.email,student_id:ALUNO.id,
      lesson:TITULO_ATIVIDADE,atividade_id:ATIVIDADE,upload_date:new Date().toISOString()},
    onError:()=>{ area.style.display='none'; esc.style.display='flex';
      esc.textContent='Tentar de novo'; erro.style.display='block'; },
    onProgress:(enviado,total)=>{ const pc=((enviado/total)*100).toFixed(0);
      document.getElementById('pct').textContent=pc;
      document.getElementById('barra').style.width=pc+'%'; },
    onSuccess:()=>{ e.videoOk=true; finalizar(); }
  });
  up.start();
}

function renderResultado(){
  const d=decidir(),cur=curso(),acima=d.saida==='passou',perfil=perfilVideo();

  palco.innerHTML=`
    <div class="res-hero"><span class="eyebrow">Ponto de Partida</span>

      </div>
    </details>`}

    ${!pedeVideo()?'':(e.videoOk?`
    <details class="dobra"><summary><span>Vídeo recebido<small>A sua análise sai em até 3 dias úteis, em Minhas Análises</small></span></summary>
      <div class="corpo">
        <p class="sub" style="margin:0 0 12px">Ela aparece junto com as análises das suas atividades.</p>
        <a class="btn no-print" style="text-decoration:none" href="${MINHAS_ANALISES}" target="_top">Ir para Minhas Análises</a>

    <section class="atv-card no-print" style="border-color:var(--coral)"><span class="atv-pill">Falta o seu vídeo</span>
      <p class="sub" style="margin:0 0 12px">Você deixou o vídeo para depois. Ele é o que me deixa ver o que resposta nenhuma mostra, e quando der é por aqui.</p>
      <button class="btn" id="gravarAgora">Gravar e enviar agora</button>
    </section>`)}

    ${rotinaHTML()}

    <details class="dobra no-print"><summary><span>Mudou alguma coisa?<small>Trocar uma resposta sem refazer tudo</small></span></summary>
      <div class="corpo"><div class="opts" id="corrigir">
        ${visiveis().map((q,i)=>`<label class="opt" data-i="${i}"><span>${q.enunciado.length>62?q.enunciado.slice(0,62)+'...':q.enunciado}</span></label>`).join('')}
      </div></div>
    </details>

    <div class="nav no-print">
      <button class="btn" id="imprimir">Salvar a minha rotina em PDF</button>
    </div>
    ${REFAZER?'<p style="text-align:center;margin-top:14px"><button class="btn-texto" id="refazer">Refazer o nivelamento do zero (provisório, para teste)</button></p>':''}
    <p class="rodape-impresso">Ponto de Partida · Clube do Ukulele${PRIMEIRO?' · '+PRIMEIRO:''} · ${new Date().toLocaleDateString('pt-BR')}</p>`;

  ligarRotina();
  /* O PDF é a rotina, e só ela: é a parte que o aluno volta a consultar. O resto da ficha
     ele lê na tela uma vez ou outra, e no papel só ocupava página. */
  document.getElementById('imprimir').onclick=()=>{
    document.body.classList.add('so-rotina');

  const lista=document.getElementById('corrigir');
  if(lista) lista.querySelectorAll('.opt').forEach(el=>{
    el.onclick=()=>{e.editando=true;e.finalizado=false;e.i=+el.dataset.i;render();};
  });
  const rf=document.getElementById('refazer');
  if(rf) rf.onclick=()=>{
    if(!confirm('Isso apaga tudo, inclusive o vídeo já enviado, e começa o nivelamento do zero. Quer mesmo?')) return;
    try{localStorage.removeItem(LS);}catch(x){}
    e=padrao(); salvar(); render();
  };
}

/* ---------- envio ---------- */
function corpoEnvio(){
  const d=decidir();
  return {
    id:ALUNO.id, email:ALUNO.email, nome:ALUNO.nome,
    tentativa_uid:e.uid, versao_questionario:'3.0',
    respostas:e.resp, decisao:{saida:d.saida,fronteira:d.fronteira,motivo:d.motivo},
    caminho:visiveis().map(q=>q.id),
    video_enviado:e.videoOk?'sim':'nao', video_pendente:(pedeVideo()&&!e.videoOk)?'sim':'nao'
  };
}
function enviar(){
  if(!API||e.enviado) return;
  fetch(API.replace(/\/$/,'')+'/finalizar',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify(corpoEnvio())
  }).then(r=>r.json()).then(j=>{ if(j&&j.ok){e.enviado=true;salvar();} }).catch(()=>{});
}
function rascunho(){
  if(!API||e.finalizado||!e.abriu) return;
  const b=JSON.stringify(corpoEnvio());
  if(navigator.sendBeacon) navigator.sendBeacon(API.replace(/\/$/,'')+'/rascunho',new Blob([b],{type:'application/json'}));
}
addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') rascunho(); });
addEventListener('pagehide',rascunho);

/* ---------- impressão ----------
   Um <details> fechado não imprime só com CSS: o Chrome esconde o conteúdo por
   content-visibility, que `display:block !important` não vence. Então abrimos de verdade
   antes de imprimir e devolvemos ao estado anterior depois. */
let dobrasAbertas=[];
addEventListener('beforeprint',()=>{
  dobrasAbertas=[...document.querySelectorAll('details.dobra')];
  dobrasAbertas.forEach(d=>{ d.dataset.estava=d.open?'1':'0'; d.open=true; });
});
addEventListener('afterprint',()=>{
  dobrasAbertas.forEach(d=>{ d.open=d.dataset.estava==='1'; delete d.dataset.estava; });
  dobrasAbertas=[];
  document.body.classList.remove('so-rotina');
});

/* ---------- teclado ---------- */
addEventListener('keydown',ev=>{
  if(e.finalizado||!e.abriu) return;
  const q=vis[e.i]; if(!q) return;
  const alvo=ev.target;
  if(alvo&&(alvo.tagName==='TEXTAREA'||alvo.tagName==='INPUT')) return;
  if(ev.key==='Enter'){
    const av=document.getElementById('avancar');
    if(av&&!av.disabled){ev.preventDefault();av.click();}
    return;
  }
  const i=LETRAS.indexOf(ev.key.toUpperCase());
  if(i>=0&&q.opcoes&&q.opcoes[i]){
    const el=palco.querySelector('.opt[data-i="'+i+'"]');
    if(el&&el.dataset.off!=='true'){ev.preventDefault();el.click();}
  }
});

/* O `remote.js` faz, no ready do jQuery, um `$("body").html(...)` para trocar {nome} e
   {email} pelos dados do aluno. Isso re-serializa o body inteiro e apaga todo ouvinte já
   ligado. Por isso a peça só monta no `load`, que vem depois do ready: aí o que o remote.js
   reescreve é só o "Carregando", e nada do que a gente ligou se perde. */
/* O `remote.js` troca o body inteiro em algum ponto depois do carregamento, para
   preencher {nome} e {email}. Isso clona o nosso `#palco` e os botões visíveis ficam
   sem handler nenhum: a página aparece e não responde a clique. Depender da ordem de
   `ready` e `load` não resolveu, porque a troca chega depois dos dois. Então a gente
   observa: se o `#palco` do documento deixar de ser o nosso, montamos de novo nele.
   Renderizar não dispara isso, porque aí o nó continua sendo o mesmo. */
/* Alça de inspeção, só com `?debug=1` na URL. Serve para conferir a peça de fora sem
   abrir o escopo do script para a página inteira. Só leitura de estado, nada que escreva. */
/* Com `?debug=1&demo=i0|i1|passou` a ficha abre direto, preenchida. É o que dá para
   conferir o PDF sem responder o quiz inteiro a cada tentativa. Nunca liga sem o debug. */
const DEMO=qs.get('debug')==='1'?qs.get('demo'):null;
const DEMOS={
  i0:{A1:'tem_toca',N1:2,N2:'app',R1:2,R2:15,O1:'para_mim',O2:'Asa Branca'},
  i1:{A1:'tem_toca',N1:4,N2:'app',NM1:'devagar',R1:4,R2:30,O1:'para_gente',O2:'Trem Bala'},
  passou:{A1:'tem_toca',N1:5,N2:'ouvido',NM1:'sai',NM2:'sai',P1:'sai',P2:'sai',R1:5,R2:45,O1:'dominio',O2:'Wherever You Will Go'}
};
if(DEMO&&DEMOS[DEMO]){ e=padrao(); e.abriu=true; e.finalizado=true; e.videoOk=true; e.resp=DEMOS[DEMO]; }
/* `&sorotina=1` junto com o demo liga o recorte da impressão sem precisar clicar no botão.
   É como o PDF da rotina é conferido por linha de comando. */
if(DEMO&&qs.get('sorotina')==='1') addEventListener('load',()=>document.body.classList.add('so-rotina'));

if(qs.get('debug')==='1') window.__pp={
  estado:()=>JSON.parse(JSON.stringify(e)),
  decidir:()=>decidir(), perfil:()=>perfilVideo(),
  video:()=>pedeVideo(), caminho:()=>visiveis().map(q=>q.id), aluno:ALUNO,
  /* Só para revisar a tela de "vídeo recebido" sem gastar um upload de verdade no tus. */
  simularVideoRecebido:()=>{ e.videoOk=true; e.videoAdiado=false; finalizar(); return 'ok'; }
};

new MutationObserver(()=>{
  const p=document.getElementById('palco');
  if(p&&p!==palco){ palco=p; render(); }
}).observe(document.documentElement,{childList:true,subtree:true});

if(document.readyState==='complete') render();
else addEventListener('load',render);
})();
</script>
</body>
</html>
