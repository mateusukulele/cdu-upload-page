<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste de Dados Cademi</title>

  <!-- Dependencia obrigatoria do Cademi para a pagina funcionar no iframe -->
  <script src="https://core.cademi.com.br/assets/js/remote.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
      line-height: 1.5;
    }
    .card {
      max-width: 600px;
      margin: 0 auto;
      background: #16213e;
      border-radius: 10px;
      padding: 24px;
      border: 1px solid #2d4373;
    }
    h1 { font-size: 18px; color: #4da6ff; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #aaa; margin-bottom: 20px; }
    .secao { font-size: 14px; color: #ffa94d; margin: 18px 0 8px; font-weight: 600; }
    .dado {
      background: #0f1730;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 6px;
      font-size: 13px;
      word-break: break-all;
    }
    .chave { color: #4da6ff; font-weight: 600; }
    .valor { color: #fff; }
    .vazio { color: #666; font-style: italic; }
    .url-box {
      background: #0f1730;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 11px;
      color: #8fb8ff;
      word-break: break-all;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Teste de Dados do Cademi</h1>
    <p class="sub">Esta pagina mostra tudo que o Cademi envia sobre o aluno logado.</p>

    <div class="secao">1. Dados via URL (parametros GET)</div>
    <div id="dados-url"></div>

    <div class="secao">2. Variavel _cademi_user (se configurada no JS do Cademi)</div>
    <div id="dados-var"></div>

    <div class="secao">3. URL completa recebida</div>
    <div class="url-box" id="url-completa"></div>
  </div>

  <script>
    // 1. Captura todos os parametros que vieram pela URL
    const params = new URLSearchParams(window.location.search);
    const divUrl = document.getElementById('dados-url');

    if ([...params].length === 0) {
      divUrl.innerHTML = '<div class="dado vazio">Nenhum parametro recebido pela URL.</div>';
    } else {
      params.forEach((valor, chave) => {
        divUrl.innerHTML += `<div class="dado"><span class="chave">${chave}</span>: <span class="valor">${valor || '(vazio)'}</span></div>`;
      });
    }

    // 2. Tenta ler a variavel _cademi_user (a do bloco de JS customizado)
    const divVar = document.getElementById('dados-var');
    try {
      if (typeof _cademi_user !== 'undefined' && _cademi_user) {
        for (const chave in _cademi_user) {
          divVar.innerHTML += `<div class="dado"><span class="chave">${chave}</span>: <span class="valor">${_cademi_user[chave] || '(vazio)'}</span></div>`;
        }
      } else {
        divVar.innerHTML = '<div class="dado vazio">Variavel _cademi_user nao encontrada (so existe se voce configurou o bloco de JS customizado).</div>';
      }
    } catch (e) {
      divVar.innerHTML = '<div class="dado vazio">Variavel _cademi_user nao disponivel neste contexto.</div>';
    }

    // 3. Mostra a URL completa pra referencia
    document.getElementById('url-completa').textContent = window.location.href;
  </script>
</body>
</html>
