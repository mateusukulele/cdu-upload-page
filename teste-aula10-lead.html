<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Teste aula 10: dados do aluno</title>
<style>
  body{margin:0;padding:16px;font:16px/1.5 system-ui,-apple-system,sans-serif;background:#fff;color:#1d1d1f}
  h1{font-size:18px;margin:0 0 12px}
  table{border-collapse:collapse;width:100%;margin-bottom:16px}
  td{border:1px solid #ddd;padding:6px 8px;word-break:break-all}
  td:first-child{font-family:ui-monospace,monospace;width:40%}
  button,a.btn{display:inline-block;margin:0 8px 8px 0;padding:12px 16px;border:0;border-radius:8px;background:#1d1d1f;color:#fff;font-size:16px;text-decoration:none;cursor:pointer}
  #log{font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap;background:#f5f5f7;padding:8px;border-radius:8px}
</style>
</head>
<body>
<h1>Página de teste (só administrador)</h1>
<table id="dados"></table>
<button id="enviar" type="button">Enviar lead de teste</button>
<a class="btn" id="wa" target="_blank" rel="noopener">Abrir WhatsApp com os dados</a>
<div id="log"></div>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var chaves = ['cuser_id','cuser_gratis','cuser_fname','cuser_name','cuser_email','cuser_phone','cuser_avatar'];
  var tab = document.getElementById('dados');
  chaves.forEach(function(k){
    var tr = document.createElement('tr');
    var a = document.createElement('td'); a.textContent = k;
    var b = document.createElement('td'); b.textContent = q.has(k) ? (q.get(k) || '(vazio)') : '(não veio)';
    tr.appendChild(a); tr.appendChild(b); tab.appendChild(tr);
  });

  var nome = q.get('cuser_name') || q.get('cuser_fname') || '';
  var email = q.get('cuser_email') || '';
  var tel = (q.get('cuser_phone') || '').replace(/\D/g, '');
  var ddi = '';
  if (tel.length > 11 && tel.indexOf('55') === 0) { ddi = '55'; tel = tel.slice(2); }

  var log = document.getElementById('log');
  function escreve(t){ log.textContent += new Date().toLocaleTimeString('pt-BR') + '  ' + t + '\n'; }

  document.getElementById('enviar').addEventListener('click', function(){
    if (!(window.parent && window.parent !== window)) { escreve('Fora do iframe da Cademí: nada enviado.'); return; }
    window.parent.postMessage({__cdu:'lead', nome:nome, email:email, wa:tel, ddi:ddi}, '*');
    escreve('postMessage enviado: ' + JSON.stringify({nome:nome, email:email, wa:tel, ddi:ddi}));
  });

  var texto = 'Teste aula 10. Nome: ' + nome + '. E-mail: ' + email + '.';
  document.getElementById('wa').href = 'https://wa.me/553198585286?text=' + encodeURIComponent(texto);
})();
</script>
<script src="/js/iframeResizer.contentWindow.min.js"></script>
</body>
</html>
